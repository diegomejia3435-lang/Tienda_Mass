
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Tiendas Mass</title>
</head>
<body>

    <h1>Tiendas Mass</h1>
    <h2>Iniciar sesión</h2>

    {% if form.errors %}
        <p>Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label>Usuario:</label>
            {{ form.username }}
        </p>

        <p>
            <label>Contraseña:</label>
            {{ form.password }}
        </p>

        <button type="submit">Ingresar</button>
    </form>

</body>
</html>
